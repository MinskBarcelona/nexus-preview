:root{ --blue:#4256F9; --navy:#142457; --card:#F8F8F9; --ink:#1C1B1F; --mute:#74747B; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Raleway',system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 50% 30%,#F4F5FC 0%,#E6E9F6 100%);
  color:var(--navy); overflow:hidden; -webkit-font-smoothing:antialiased;
}
body.clean{background:#EDEFF8}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.fitbox{position:relative;flex:none}
.phone{
  position:absolute;left:0;top:0;transform-origin:0 0;
  width:380px;height:820px;padding:10px;border-radius:46px;background:#0D1230;
  box-shadow:0 30px 60px -20px rgba(20,36,87,.45),0 12px 24px -12px rgba(20,36,87,.35),inset 0 0 0 1.5px #2A3166;
}
.screen{position:relative;width:360px;height:800px;border-radius:36px;overflow:hidden;background:#fff;isolation:isolate}
.layer{position:absolute;inset:0;overflow:hidden;background:#fff;will-change:transform,opacity}
#L-estado{z-index:1}
#L-detalle{z-index:2;box-shadow:-12px 0 28px rgba(20,36,87,.14)}
#L-chat{z-index:3;box-shadow:-12px 0 28px rgba(20,36,87,.14)}
.scr{position:absolute;left:0;top:0;width:360px;will-change:transform}
.scr img,#L-detalle>img{display:block;width:360px;height:auto;user-select:none;-webkit-user-drag:none}
.sbar{position:absolute;left:0;top:0;width:360px;height:45px;overflow:hidden;background:#fff;z-index:3}
.sbar img{display:block;width:360px;height:45px}

/* ---------- Xat: Solucionador de problemes ---------- */
#cclip{position:absolute;left:0;top:0;width:360px;height:800px;overflow:hidden}
#cwrap{position:absolute;left:0;top:0;width:360px;will-change:transform;padding-top:117px;padding-bottom:140px}
#cwrap p{margin:0 0 8px;font:400 16px/20px 'Raleway';color:var(--ink)}
#cwrap p.hd{font-weight:600;color:var(--blue)}
.ai{margin:0 36px 0 21px;position:relative}
#ubwrap{display:flex;justify-content:flex-end;margin:20px 25px 0 0}
#ubub{max-width:262px;background:#ECEEFE;border-radius:26px;padding:12px 20px;font:600 16px/20px 'Raleway';color:var(--navy);
  opacity:0;transform-origin:100% 100%}
#ans{margin-top:24px}
#ans .li{display:flex;margin:0 0 8px}
#ans .li .n{flex:none;width:24px;font:400 16px/20px 'Raleway';color:var(--ink)}
#ans .li p{margin:0;flex:1}
#ans .h{color:transparent}
#dots{position:absolute;left:0;top:0;height:20px;display:flex;align-items:center;gap:5px;opacity:0}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
#appbar{position:absolute;left:0;top:0;width:360px;height:100px;background:#fff;z-index:6}
#appbar img{display:block;width:360px;height:100px}

#bar{position:absolute;left:0;width:360px;background:var(--card);border-radius:30px 30px 0 0;box-shadow:0 -3px 14px rgba(20,36,87,.10);z-index:7}
#pill{position:absolute;left:29px;width:303px;border-radius:28px;background:#fff;box-shadow:0 2px 10px rgba(20,36,87,.10);z-index:8}
#icons{position:absolute;left:210px;top:699px;width:60px;height:29px;z-index:9}
#mic{position:absolute;left:278px;top:687px;width:52px;height:52px;border-radius:50%;z-index:9}
#home{position:absolute;left:126px;top:784px;width:108px;height:6px;border-radius:3px;background:var(--navy);z-index:9}
#ph{position:absolute;left:46px;top:703px;font:500 16px/20px 'Raleway';color:var(--ink);white-space:nowrap;z-index:9}
#field{position:absolute;left:46px;width:164px;z-index:9}
#txt{position:relative;font:400 16px/20px 'Raleway';color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
#cm{display:inline-block;width:0;height:20px;vertical-align:top}
#caret{position:absolute;width:1.5px;height:18px;background:var(--blue);border-radius:1px;z-index:10}
#keycap{position:absolute;left:128px;top:500px;width:104px;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--navy);color:#fff;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.2px;
  box-shadow:0 4px 0 #0A1237,0 10px 20px rgba(20,36,87,.35);opacity:0;z-index:20}
#keycap span{font-size:17px;line-height:1}

/* ---------- Cursor ---------- */
#fx{position:absolute;inset:0;z-index:50;pointer-events:none}
#trail{position:absolute;width:8px;border-radius:4px;opacity:0}
#ripple{position:absolute;border-radius:50%;opacity:0;background:rgba(66,86,249,.18);border:3px solid #fff;box-shadow:0 0 0 3px rgba(66,86,249,.6)}
#cursor{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;opacity:0;
  background:var(--blue);border:3px solid #fff;box-shadow:0 4px 12px rgba(20,36,87,.42),0 0 0 1px rgba(20,36,87,.12)}
#cursor i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;opacity:.92}

/* ---------- Controls ---------- */
.controls{display:flex;align-items:center;gap:12px;width:min(92vw,420px);height:40px;flex:none}
body.clean .controls{display:none}
.btn{width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 14px -4px rgba(66,86,249,.55);transition:transform .12s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.94)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(20,36,87,.14)}
.btn svg{width:18px;height:18px;fill:currentColor;pointer-events:none}
.track{flex:1;display:flex;flex-direction:column;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#D4D9F0;outline:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 1px 4px rgba(20,36,87,.4)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.time{font-size:11px;font-weight:600;color:#6B74A6;letter-spacing:.3px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<main class="stage">
  <div class="fitbox" id="fitbox">
    <div class="phone" id="phone">
      <div class="screen" id="screen">

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const QUESTION = 'He revisado el error y no veo ningún obstáculo delante de la puerta ni a los laterales. ¿Cómo puedo resolverlo?';
const BLOCKS = [
  { k: 'p',  s: 'Si no detectas ningún obstáculo delante ni a los laterales de la puerta, revisa también la guía o zona de desplazamiento.' },
  { k: 'p',  s: 'A veces, pequeños elementos como polvo acumulado, suciedad, piedrecitas, tornillos, fragmentos u otros objetos de pequeño tamaño pueden interferir en el movimiento de la puerta, aunque no sean visibles a simple vista.' },
  { k: 'p',  s: 'Te recomiendo:' },
  { k: 'li', n: '1.', s: 'Revisar visualmente toda la guía y el recorrido de la puerta.' },
  { k: 'li', n: '2.', s: 'Retirar cualquier resto de suciedad u objeto que pueda dificultar el desplazamiento.' },
  { k: 'li', n: '3.', s: 'Comprobar que no haya ninguna pieza desplazada o sobresaliente.' },
  { k: 'li', n: '4.', s: 'Una vez limpia la zona, prueba de nuevo el funcionamiento de la puerta.' }
];
const params = new URLSearchParams(location.search);
if (params.has('clean')) document.body.classList.add('clean');
const SPEED = parseFloat(params.get('speed')) || 1;

/* ================= utilitats d'animació ================= */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = {
  lin: u => u,
  io:  u => .5 - .5 * Math.cos(Math.PI * u),
  out: u => 1 - Math.pow(1 - u, 3)
};
const tw = (t, a, b, v0, v1, e = 'io') => v0 + (v1 - v0) * E[e](clamp((t - a) / (b - a)));

/* ================= guió (temps en segons) ================= */
const T = {
  pushA: [8.05, 8.65],     // fitxa → detall de l'avís
  pushB: [12.95, 13.55],   // detall → solucionador
  focus: 16.60, typeStart: 17.25
};
const MAX = { E: 1029 };   // recorregut màxim de scroll de la fitxa (px)

/* escriptura de la pregunta */
const TYPE_T = [];
{ let tt = T.typeStart; for (let i = 0; i < QUESTION.length; i++) {
    tt += .048 + .038 * (.5 + .5 * Math.sin(i * 12.9898 + 1.7)) + (QUESTION[i] === ' ' ? .03 : 0);
    TYPE_T.push(tt);
} }
const S = TYPE_T[TYPE_T.length - 1] + 1.00;            // Intro: s'envia la pregunta
T.send = S;
T.dots = [S + 1.15, S + 2.35];
const ANS0 = S + 2.45;                                 // comença a escriure la resposta la mIA

/* paraules de la resposta, amb el seu instant d'aparició */
const RATE = 58;                                       // caràcters / segon
const WORDS = [];
{ let tt = ANS0;
  BLOCKS.forEach((b, bi) => {
    if (bi > 0) tt += (b.k === 'li' ? .22 : .38);
    const re = /\S+\s*/g; let m;
    while ((m = re.exec(b.s))) { WORDS.push({ b: bi, end: m.index + m[0].length, last: m.index + m[0].trimEnd().length - 1, t: tt }); tt += m[0].length / RATE; }
  });
  T.ansEnd = tt;
}
const D = T.ansEnd + 4.40;                             // durada del bucle
T.dip = [D - .70, D - .35];
T.back = [D - .35, D];

/* ================= cursor ================= */
const KF = [], CLICKS = [], GESTURES = [], SC = [];
let st = { t: 0, x: 318, y: 640, press: 0, op: 0, ease: 'io', straight: false };
function K(t, o = {}) { st = { ...st, ...o, t: Math.max(t, st.t), ease: o.ease || 'io', straight: !!o.straight }; KF.push({ ...st }); }
function tap(t, x, y, o = {}) {                       // arriba a (x,y) a t; el clic és a t+0.30
  K(t, { x, y, ...o });
  K(t + .10); K(t + .18, { press: 1, ease: 'lin' });
  K(t + .30); K(t + .42, { press: 0, ease: 'lin' });
  CLICKS.push({ t: t + .30, x, y });
}
function flick(n, a, dur, x, yA, yB, inertia, ease = 'out') {
  K(a - .10); K(a, { press: 1, ease: 'lin' });
  K(a + dur, { x, y: yB, straight: true, ease });
  GESTURES.push({ a, b: a + dur, x, y0: yA, y1: yB });
  const d = yA - yB;
  SC.push({ n, a, b: a + dur, d, e: ease });
  if (inertia) SC.push({ n, a: a + dur, b: a + dur + .55, d: Math.sign(d) * inertia, e: 'out' });
  K(a + dur + .12, { press: 0, ease: 'lin' });
}
const scrollVal = (n, t) => clamp(SC.filter(s => s.n === n).reduce((acc, s) => acc + tw(t, s.a, s.b, 0, s.d, s.e), 0), 0, MAX[n]);

K(0.00, { x: 318, y: 640, op: 0 });
K(0.50, { op: 1, ease: 'lin' });
/* 1 · Fitxa: es veu la portada i es fa scroll fins als avisos */
K(1.40, { x: 250, y: 560 });
K(1.80, { x: 200, y: 650 });
flick('E', 2.20, 1.80, 200, 650, 250, 0, 'io');          // scroll 1 (400 px)
K(4.25, { x: 200, y: 650 });
flick('E', 4.50, 1.60, 200, 650, 290, 0, 'io');          // scroll 2 (360 px): s'arriba a «Avisos detectados»
tap(7.60, 75, 477);                                       // clic a l'avís nº12 «Obstáculo Cerrar»
/* 2 · Detall: pausa de lectura i clic a «Obtener ayuda de mIA» */
K(10.00, { x: 250, y: 560 });
tap(12.40, 180, 722);
/* 3 · Solucionador: clic al camp d'escriptura i després el cursor desapareix */
K(14.10, { x: 250, y: 560 });
tap(16.20, 110, 713);
K(17.35, { op: 0, ease: 'lin' });
K(D);

function cursorAt(t) {
  if (t <= KF[0].t) return KF[0];
  for (let i = 0; i < KF.length - 1; i++) {
    const a = KF[i], b = KF[i + 1];
    if (t >= a.t && t < b.t) {
      const u = (t - a.t) / (b.t - a.t), e = E[b.ease](u);
      let x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (!b.straight && d > 90) {                       // trajectòria lleugerament corba
        const s = (i % 2 ? 1 : -1) * d * .11, cx = (a.x + b.x) / 2 - dy / d * s, cy = (a.y + b.y) / 2 + dx / d * s;
        x = (1-e)*(1-e)*a.x + 2*(1-e)*e*cx + e*e*b.x;
        y = (1-e)*(1-e)*a.y + 2*(1-e)*e*cy + e*e*b.y;
      }
      return { x, y, press: a.press + (b.press - a.press) * u, op: a.op + (b.op - a.op) * u };
    }
  }
  return KF[KF.length - 1];
}

/* ================= elements ================= */
const el = {
  estado: $('L-estado'), detalle: $('L-detalle'), chat: $('L-chat'),
  sE: $('S-estado'), sbE: $('sb-estado'),
  cwrap: $('cwrap'), ubub: $('ubub'), ans: $('ans'), dots: $('dots'),
  bar: $('bar'), pill: $('pill'), ph: $('ph'), field: $('field'), txt: $('txt'), caret: $('caret'), key: $('keycap'),
  cursor: $('cursor'), ripple: $('ripple'), trail: $('trail')
};
const vis = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
el.ubub.textContent = QUESTION;

/* resposta de la mIA: cada bloc té una part visible i una d'amagada (el disseny no es mou mentre s'escriu) */
const blk = BLOCKS.map(b => {
  const p = document.createElement('p'), v = document.createElement('span'), h = document.createElement('span');
  v.className = 'v'; h.className = 'h'; h.textContent = b.s; p.append(v, h);
  let host = p;
  if (b.k === 'li') {
    host = document.createElement('div'); host.className = 'li';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = b.n; host.append(n, p);
    b.numEl = n; n.style.opacity = 0;
  }
  el.ans.appendChild(host);
  return { v, h, p };
});

/* posició (Y) de la línia on acaba cada paraula, per fer l'scroll automàtic del xat */
let WY = null;
function measure() {
  const sc = $('phone').getBoundingClientRect().width / 380;
  const base = el.cwrap.getBoundingClientRect().top;
  const r = document.createRange();
  WY = WORDS.map(w => {
    const node = blk[w.b].v.firstChild; if (!node) return 0;
    r.setStart(node, w.last); r.setEnd(node, w.last + 1);
    return (r.getBoundingClientRect().bottom - base) / sc;
  });
}
const wordsShown = t => { let n = 0; while (n < WORDS.length && WORDS[n].t <= t) n++; return n; };
const followY = t => { const n = wordsShown(t); return n ? Math.max(0, (WY ? WY[n - 1] : 0) - 618) : 0; };
const chatScroll = t => {                                 // seguiment suau de l'última línia escrita
  if (t < ANS0 - .1) return 0;
  let s = 0; for (let i = 0; i < 9; i++) s += followY(t - i * .05); return s / 9;
};

let lastWords = -1, lastTyped = -1;
function setAnswer(n) {
  if (n === lastWords) return; lastWords = n;
  const cnt = BLOCKS.map(() => 0);
  for (let i = 0; i < n; i++) cnt[WORDS[i].b] = WORDS[i].end;
  BLOCKS.forEach((b, i) => {
    blk[i].v.textContent = b.s.slice(0, cnt[i]);
    blk[i].h.textContent = b.s.slice(cnt[i]);
    if (b.numEl) b.numEl.style.opacity = cnt[i] > 0 ? 1 : 0;
  });
}

let ext = 0;
function setField(typed) {
  if (typed !== lastTyped) {
    lastTyped = typed;
    el.txt.textContent = QUESTION.slice(0, typed);
    const cm = document.createElement('span'); cm.id = 'cm'; el.txt.appendChild(cm);
    const h = typed ? el.txt.offsetHeight : 20;
    const lines = Math.max(1, Math.min(7, Math.round(h / 20)));
    ext = (lines - 1) * 20;
    el.bar.style.top = (661 - ext) + 'px'; el.bar.style.height = (139 + ext) + 'px';
    el.pill.style.top = (685 - ext) + 'px'; el.pill.style.height = (56 + ext) + 'px';
    el.field.style.top = (703 - ext) + 'px';
  }
}

/* ================= render(t): estat complet en un instant ================= */
function render(t) {
  const pA = tw(t, ...T.pushA, 0, 1, 'out');
  const pB = tw(t, ...T.pushB, 0, 1, 'out');
  const dip = tw(t, ...T.dip, 0, 1, 'lin');
  const back = tw(t, ...T.back, 0, 1, 'lin');
  const inLoopEnd = t >= T.dip[0];

  // 1 · fitxa
  const sE = inLoopEnd ? 0 : scrollVal('E', t);
  el.sE.style.transform = `translateY(${-sE}px)`;
  el.sbE.style.opacity = clamp((sE - 250) / 60);
  el.estado.style.transform = `translateX(${inLoopEnd ? 0 : -90 * pA}px)`;
  el.estado.style.opacity = inLoopEnd ? back : 1;
  vis(el.estado, t < T.pushA[1] + .05 || inLoopEnd);

  // 2 · detall de l'avís
  el.detalle.style.transform = `translateX(${360 * (1 - pA) - 90 * pB}px)`;
  vis(el.detalle, t >= T.pushA[0] && t < T.pushB[1] + .05 && !inLoopEnd);

  // 3 · solucionador
  el.chat.style.transform = `translateX(${360 * (1 - pB)}px)`;
  el.chat.style.opacity = 1 - dip;
  vis(el.chat, t >= T.pushB[0] && t < T.back[0]);

  const focused = t >= T.focus && t < S;
  const typed = t < S ? TYPE_T.filter(x => x <= t).length : 0;
  setField(typed);
  el.ph.style.opacity = (focused || typed > 0) ? 0 : 1;
  const cm = $('cm');
  const recently = typed > 0 && t - (TYPE_T[typed - 1] || 0) < .35;
  const blink = recently || (Math.floor(t * 2) % 2 === 0);
  el.caret.style.opacity = focused && blink ? 1 : 0;
  if (cm) { el.caret.style.left = (46 + cm.offsetLeft + 1) + 'px'; el.caret.style.top = (703 - ext + cm.offsetTop + 1) + 'px'; }

  // tecla Intro
  const kOp = tw(t, S - .45, S - .30, 0, 1, 'out') * (1 - tw(t, S + .12, S + .35, 0, 1, 'lin'));
  const kPr = tw(t, S - .17, S - .08, 0, 1, 'lin') * (1 - tw(t, S, S + .12, 0, 1, 'lin'));
  el.key.style.top = (661 - ext - 62) + 'px';
  el.key.style.opacity = kOp;
  el.key.style.transform = `translateY(${3 * kPr}px) scale(${1 - .03 * kPr})`;
  el.key.style.boxShadow = kPr > .5 ? '0 1px 0 #0A1237,0 6px 14px rgba(20,36,87,.3)' : '0 4px 0 #0A1237,0 10px 20px rgba(20,36,87,.35)';

  // la pregunta passa a ser una bombolla del xat
  const ub = tw(t, S + .05, S + .65, 0, 1, 'out');
  el.ubub.style.opacity = clamp(ub * 1.6);
  el.ubub.style.transform = `translateY(${(1 - ub) * 14}px) scale(${.96 + .04 * ub})`;

  // «mIA està escrivint…»
  const dOn = tw(t, T.dots[0], T.dots[0] + .2, 0, 1, 'lin') * (1 - tw(t, T.dots[1], T.dots[1] + .15, 0, 1, 'lin'));
  el.dots.style.opacity = dOn;
  [...el.dots.children].forEach((d, i) => { d.style.transform = `translateY(${-3.5 * Math.max(0, Math.sin(t * 7 - i * .9))}px)`; });

  // resposta de la mIA + scroll automàtic
  setAnswer(wordsShown(t));
  el.cwrap.style.transform = `translateY(${-chatScroll(t)}px)`;

  /* --- cursor, ondulació de clic i traça d'arrossegament --- */
  const c = cursorAt(t);
  el.cursor.style.opacity = c.op;
  el.cursor.style.transform = `translate(${c.x}px,${c.y}px) scale(${1 - .2 * c.press})`;
  el.cursor.style.background = c.press > .02 ? `color-mix(in srgb,#142457 ${Math.round(c.press * 55)}%,#4256F9)` : '';

  let rOn = false;
  for (const k of CLICKS) {
    const u = (t - k.t) / .65;
    if (u >= 0 && u <= 1) {
      const s = 30 + 70 * E.out(u);
      Object.assign(el.ripple.style, { opacity: .85 * (1 - u), width: s + 'px', height: s + 'px',
        left: (k.x - s / 2) + 'px', top: (k.y - s / 2) + 'px' });
      rOn = true; break;
    }
  }
  if (!rOn) el.ripple.style.opacity = 0;

  let tr = 0;
  for (const g of GESTURES) {
    if (t >= g.a && t <= g.b + .35) {
      const cy = t <= g.b ? c.y : g.y1;
      const top = Math.min(g.y0, cy), h = Math.abs(g.y0 - cy), up = cy < g.y0;
      const op = (t <= g.b ? 1 : 1 - (t - g.b) / .35);
      Object.assign(el.trail.style, {
        left: (g.x - 4) + 'px', top: top + 'px', height: h + 'px', opacity: op * c.op,
        background: `linear-gradient(${up ? 'to bottom' : 'to top'},rgba(66,86,249,.5),rgba(66,86,249,0))`
      });
      tr = 1; break;
    }
  }
  if (!tr) el.trail.style.opacity = 0;
}

/* ================= reproductor (play / pausa) ================= */
const bPlay = $('bPlay'), bRestart = $('bRestart'), seek = $('seek'), tNow = $('tNow'), tTot = $('tTot');
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
seek.max = D; tTot.textContent = fmt(D + .01);
let shownPlaying = null, shownT = '';
let t = 0, playing = !params.has('paused'), last = performance.now(), scrubbing = false;

function ui() {
  if (shownPlaying !== playing) {
    shownPlaying = playing;
    bPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    bPlay.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
    bPlay.title = (playing ? 'Pausa' : 'Reproducir') + ' (espai)';
  }
  if (!scrubbing) seek.value = t;
  const tx = fmt(t); if (tx !== shownT) { shownT = tx; tNow.textContent = tx; }
}
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing && !scrubbing) { t += Math.min(dt, .1) * SPEED; if (t >= D) t -= D; }
  render(t); ui();
  requestAnimationFrame(frame);
}
const setPlaying = p => { playing = p; last = performance.now(); ui(); };
const toggle = () => setPlaying(!playing);
const restart = () => { t = 0; setPlaying(true); render(t); };
bPlay.addEventListener('pointerdown', e => e.preventDefault());       // el botó no agafa el focus (evita doble canvi amb Espai)
bPlay.addEventListener('click', toggle);
bRestart.addEventListener('pointerdown', e => e.preventDefault());
bRestart.addEventListener('click', restart);
const endScrub = () => { if (scrubbing) { scrubbing = false; last = performance.now(); } };
seek.addEventListener('pointerdown', () => { scrubbing = true; });
seek.addEventListener('input', () => { t = parseFloat(seek.value); render(t); ui(); });
seek.addEventListener('change', endScrub);
addEventListener('pointerup', endScrub);
addEventListener('pointercancel', endScrub);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) toggle(); }
  else if (e.key === 'r' || e.key === 'R') restart();
});
addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });   // evita el clic fantasma d'un botó amb focus
// si la pestanya queda en segon pla, no hi ha salts en tornar
document.addEventListener('visibilitychange', () => { last = performance.now(); });

/* ================= ajust a la finestra ================= */
const fitbox = $('fitbox'), phone = $('phone');
function fit() {
  const clean = document.body.classList.contains('clean');
  const availH = innerHeight - (clean ? 24 : 24 + 16 + 40 + 16);
  const s = Math.min(availH / 820, (innerWidth * .94) / 380);
  fitbox.style.width = (380 * s) + 'px'; fitbox.style.height = (820 * s) + 'px';
  phone.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

window.__seek = s => { playing = false; t = s; render(t); ui(); };
window.__D = D; window.__state = () => ({ t, playing });
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
  setAnswer(WORDS.length); measure(); lastWords = -1;     // mesura amb el text complet i torna a l'estat inicial
  render(t); ui(); requestAnimationFrame(now => { last = now; frame(now); });
});
})();
</script>
</body>
