<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eSAT · Animationen zur Freigabe</title>
<style>
:root{--navy:#152764;--blue:#4256F9;--light:#6AABE4;--text:#353535;--bg:#EEF0F8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"FS Emeric",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.02em;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{font:inherit;font-size:14px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
nav button .n{font-size:11px;opacity:.7}
nav button:hover{border-color:#fff}
nav button[aria-selected=true]{background:#fff;color:var(--navy);border-color:#fff}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
footer{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-top:1px solid #dde1ef}
footer button{font:inherit;border:0;background:var(--navy);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}
footer button:hover{background:var(--blue)}
#cur{flex:1;text-align:center;font-size:15px;color:var(--navy)}
#cur span{display:block;font-size:12px;color:#6b7086}
@media (max-width:760px){
  header{padding:10px 16px}
  nav{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">Manusa · eSAT<small>Interface-Animationen zur Freigabe</small></div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main><iframe id="f" title="eSAT-Animation" allow="autoplay"></iframe></main>
<footer>
  <button id="prev" aria-label="Vorherige Animation">‹</button>
  <div id="cur"></div>
  <button id="next" aria-label="Nächste Animation">›</button>
</footer>
<script>
const A=[
 {t:"Interaktionsdemo",f:"anim/01-demo.html"},
 {t:"Intelligente Störungsdiagnose",f:"anim/02-diagnostic.html"},
 {t:"Intelligente Leistung",f:"anim/03-rendiment.html"},
 {t:"Neue Installation",f:"anim/04-nova-installacio.html"}
];
const tabs=document.getElementById('tabs'),f=document.getElementById('f'),cur=document.getElementById('cur');
A.forEach((a,i)=>{const b=document.createElement('button');b.role='tab';b.innerHTML=`<span class="n">${i+1}</span>${a.t}`;b.onclick=()=>go(i);tabs.appendChild(b)});
let idx=0;
function go(i){idx=(i+A.length)%A.length;f.src=A[idx].f;
 [...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j===idx));
 cur.innerHTML=`${A[idx].t}<span>${idx+1} von ${A.length}</span>`;
 history.replaceState(null,'','#'+(idx+1));f.onload=()=>{try{f.contentWindow.focus()}catch(e){}}}
document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>

</body></html>
